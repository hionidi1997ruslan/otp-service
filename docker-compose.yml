services:
  postgres:
    image: postgres:16
    container_name: otp-postgres
    environment:
      POSTGRES_DB: otp           # бд создастся при первом запуске
      POSTGRES_USER: otp
      POSTGRES_PASSWORD: otp     # локальный стенд, пароль простой
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"              # порт на компе : порт в контейнере
    volumes:
      - pgdata:/var/lib/postgresql/data  # чтобы данные не пропадали после перезапуска контейнера

volumes:
  pgdata:
