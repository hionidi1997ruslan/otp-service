spring.application.name=demo

# postgres из docker-compose
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/otp
spring.datasource.username=otp
spring.datasource.password=otp

# hibernate сам создает и обновляет таблицы по entity
spring.jpa.hibernate.ddl-auto=update
# печатать sql в консоль
spring.jpa.show-sql=true

# actuator, какие эндпоинты открыть наружу
management.endpoints.web.exposure.include=health,info,prometheus,metrics
# в /actuator/health показывать подробности (статус бд и тд)
management.endpoint.health.show-details=always
